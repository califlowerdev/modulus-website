# Pricing lives on Products — real 301 so crawlers never see the meta-refresh stub.
# force = true because pricing.html exists and would otherwise serve at /pricing.
[[redirects]]
  from = "/pricing"
  to = "/studio#pricing"
  status = 301
  force = true

# Download flow: /download serves a short interstitial (download.html) that warns
# about the Windows SmartScreen prompt before the file lands and auto-starts it;
# /download/win is the actual versioned installer. Update the version each release.
[[redirects]]
  from = "/download/win"
  to = "https://github.com/califlowerdev/modulus-releases/releases/download/v1.139.0/Modulus.Studio_1.139.0_x64-setup.exe"
  status = 302
[[redirects]]
  from = "/download.html"
  to = "/download"
  status = 301
  force = true

# Old Solutions page folded into Services.
[[redirects]]
  from = "/solutions"
  to = "/services"
  status = 301
  force = true
[[redirects]]
  from = "/solutions.html"
  to = "/services"
  status = 301
  force = true

# Netlify serves 404.html automatically for unknown paths.
