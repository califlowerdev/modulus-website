# Netlify config for the Modulus marketing site (static — no build step).
[build]
  publish = "."

# Security headers on every response (Milestone 1 — from the Antigravity audit).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://modulus-analytics-ingest.modulustech.workers.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Long-cache the stable brand assets. HTML/CSS/JS keep Netlify's default
# revalidation so a deploy is always picked up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Clean URLs: bounce any direct ".html" hit to the extensionless path.
# force = true because the .html files exist and would otherwise serve directly.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
