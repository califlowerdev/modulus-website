# Netlify config for the Modulus marketing site (static — no build step).
[build]
  publish = "."

# Security headers on every response (Milestone 1 — from the Antigravity audit).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Clean URLs: bounce any direct ".html" hit to the extensionless path.
# force = true because the .html files exist and would otherwise serve directly.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true
[[redirects]]
  from = "/products.html"
  to = "/products"
  status = 301
  force = true
[[redirects]]
  from = "/pricing.html"
  to = "/pricing"
  status = 301
  force = true
[[redirects]]
  from = "/studio.html"
  to = "/studio"
  status = 301
  force = true
[[redirects]]
  from = "/insights.html"
  to = "/insights"
  status = 301
  force = true
[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true
[[redirects]]
  from = "/login.html"
  to = "/login"
  status = 301
  force = true
[[redirects]]
  from = "/account.html"
  to = "/account"
  status = 301
