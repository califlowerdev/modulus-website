<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modulus Technologies — Sign in</title>
  <meta name="description" content="Sign in or create your Modulus account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="redo.css" />
  <style>
    .authwrap { min-height: 78vh; display: grid; place-items: center; padding: 72px 0; }
    .authcard { max-width: 430px; width: 100%; margin: 0 auto; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 44px 40px; box-shadow: 0 40px 90px -50px rgba(11,11,15,.32); }
    .authcard .mk { width: 44px; height: 44px; border-radius: 12px; display: block; margin: 0 auto 20px; }
    .authcard h1 { font-size: 28px; }
    .authcard .lead { color: var(--ink-2); margin: 10px 0 24px; font-size: 15px; }
    .authtabs { display: flex; gap: 4px; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--pill); padding: 4px; margin-bottom: 26px; }
    .authtabs button { flex: 1; border: 0; background: transparent; font-family: inherit; font-weight: 600; font-size: 14px; padding: 10px; border-radius: var(--pill); color: var(--ink-2); cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
    .authtabs button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(11,11,15,.12); }
    .authform { display: grid; gap: 16px; text-align: left; }
    .authform .field label { font-size: 12.5px; }
    .authform .btn { width: 100%; margin-top: 4px; }
    .forgot { text-align: right; margin-top: -6px; }
    .forgot a { font-size: 13px; color: var(--gold-deep); font-weight: 600; }
    .divider { display: flex; align-items: center; gap: 14px; color: var(--ink-3); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 22px 0; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 11px; width: 100%; padding: 13px; border-radius: var(--pill); background: var(--paper); color: var(--ink); font-weight: 600; font-size: 15px; border: 1px solid var(--line); cursor: pointer; transition: transform .2s var(--spring), box-shadow .2s, border-color .2s; font-family: inherit; }
    .gbtn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -16px rgba(11,11,15,.3); border-color: rgba(11,11,15,.25); }
    .gbtn svg { width: 19px; height: 19px; }
    .authnote { font-size: 12.5px; color: var(--ink-3); margin-top: 20px; }
    .foundation { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(200,167,91,.12); color: var(--gold-deep); font-size: 13px; font-weight: 600; }
    #nameField { display: none; }
    body[data-mode="create"] #nameField { display: block; }
    body[data-mode="create"] .forgot { display: none; }
  </style>
</head>
<body data-mode="signin">
  <main id="main">
    <div class="authwrap">
      <div class="wrap">
        <div class="authcard fade-up">
          <img class="mk" src="assets/modulus-mark.png" alt="Modulus" />
          <h1 id="authTitle">Welcome back.</h1>
          <p class="lead" id="authLead">Sign in to manage your account and products.</p>

          <div class="authtabs" role="tablist">
            <button id="tabSignin" class="on" type="button" onclick="setMode('signin')">Sign in</button>
            <button id="tabCreate" type="button" onclick="setMode('create')">Create account</button>
          </div>

          <form class="authform" id="authForm">
            <div class="field" id="nameField"><label for="a-name">Full name</label><input id="a-name" type="text" autocomplete="name" /></div>
            <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required /></div>
            <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="current-password" required minlength="8" /></div>
            <div class="forgot"><a href="#" data-auth="forgot">Forgot password?</a></div>
            <button class="btn btn-gold" type="submit" id="authSubmit">Sign in</button>
          </form>

          <div class="foundation" id="foundation">This is the front-end. Real sign-in turns on once we wire the backend (Google + email).</div>

          <div class="divider">or</div>

          <button class="gbtn" type="button" data-auth="google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.7-.06-1.4-.18-2.06H12v3.9h5.9a5 5 0 0 1-2.2 3.3v2.74h3.56c2.08-1.92 3.24-4.74 3.24-8.08z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.74c-.99.66-2.26 1.05-3.72 1.05-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.12a6.6 6.6 0 0 1 0-4.24V7.04H2.18a11 11 0 0 0 0 9.92z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.2 1.64l3.15-3.15A11 11 0 0 0 12 1a11 11 0 0 0-9.82 6.04l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
            Continue with Google
          </button>

          <p class="authnote">We only use your account to sign you in. Nothing is posted on your behalf.</p>
        </div>
      </div>
    </div>
  </main>
  <script src="site.js"></script>
  <script>
    function setMode(m) {
      document.body.setAttribute("data-mode", m);
      document.getElementById("tabSignin").classList.toggle("on", m === "signin");
      document.getElementById("tabCreate").classList.toggle("on", m === "create");
      document.getElementById("authTitle").textContent = m === "create" ? "Create your account." : "Welcome back.";
      document.getElementById("authLead").textContent = m === "create" ? "Start with Modulus Studio and grow from there." : "Sign in to manage your account and products.";
      document.getElementById("authSubmit").textContent = m === "create" ? "Create account" : "Sign in";
      document.getElementById("a-pass").setAttribute("autocomplete", m === "create" ? "new-password" : "current-password");
    }
    /* The Google button, email sign-in, and create-account are wired by backend.js.
       Real auth runs once keys are set in backend.js; until then it shows the note. */
  </script>
</body>
</html>
