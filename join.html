<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modulus Studio | Join your team</title>
  <meta name="description" content="Accept your Modulus Studio team invite." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#070f1c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="redo.css" />
  <link rel="stylesheet" href="studio.css" />
</head>
<body data-section="app">
  <main id="main">
    <section class="dash">
      <div class="wrap">
        <div class="acctcard-wrap">
          <div id="joinCard" class="signedout glass">
            <img class="mk" src="assets/modulus-mark.png" alt="Modulus" />
            <h1>Join your team</h1>
            <p id="joinStatus" role="status" aria-live="polite">Checking your invite&hellip;</p>
            <a class="s-btn gold" id="joinSignIn" href="/login" style="display:none">Sign in to accept</a>
            <a class="s-btn gold" id="joinGo" href="/account#team" style="display:none">Go to your dashboard</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="site.js"></script>
</body>
</html>
