# Cloudflare Worker: first-party analytics ingest for modulustech.ai.
# Served from the workers.dev subdomain (DNS for modulustech.ai is at GoDaddy, not
# Cloudflare, so we do NOT bind a custom domain — zero DNS risk to the live site).
# Hashes visitors at the edge so raw IP/UA never reach Supabase logs. Rate limiting
# (a Cloudflare WAF rule) needs a zone on Cloudflare, so it's deferred; the code's
# domain allowlist + bot filter + fail-closed salt cover the launch.
name = "modulus-analytics-ingest"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Public (non-secret) config. The service-role KEY is set separately as a secret
# (wrangler secret put SUPABASE_SERVICE_KEY) and is never committed.
[vars]
SUPABASE_URL = "https://deypezfcawzdcfhnckxp.supabase.co"

# KV namespace holding the daily rotating salt.
[[kv_namespaces]]
binding = "SALT_KV"
id = "68eb8b6f74dd45eaa5dca39f0f8ccd2c"

# Daily salt rotation: runs at 23:00 UTC to PRE-GENERATE the next UTC day's salt
# (1-hour head start so it propagates to all edge regions before midnight,
# Antigravity rev2 #1), and prunes salts older than the 2-day window.
[triggers]
crons = ["0 23 * * *"]

# Route: bind the Worker to the subdomain.
# [[routes]]
# pattern = "collect.modulustech.ai/*"
# zone_name = "modulustech.ai"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   SUPABASE_URL          e.g. https://deypezfcawzdcfhnckxp.supabase.co
#   SUPABASE_SERVICE_KEY  the sb_secret_/service-role key (server-only)
