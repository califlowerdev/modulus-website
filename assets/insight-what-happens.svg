<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="What happens to your book after you upload">
  <defs>
    <linearGradient id="iw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1B2E"/><stop offset="1" stop-color="#13283f"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#iw)"/>
  <!-- the one book -->
  <g transform="translate(48,52)">
    <rect x="0" y="0" width="60" height="78" rx="7" fill="none" stroke="#C8A75B" stroke-width="1.6" opacity=".85"/>
    <line x1="0" y1="0" x2="0" y2="78" stroke="#C8A75B" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="14" y1="20" x2="46" y2="20" stroke="#9FB0C2" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="#9FB0C2" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
    <line x1="14" y1="44" x2="38" y2="44" stroke="#9FB0C2" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
  </g>
  <!-- fan of connectors -->
  <g fill="none" stroke="#C8A75B" stroke-width="1.4" opacity=".75">
    <path d="M120 78 C160 78 178 46 212 46"/>
    <path d="M120 90 C166 90 182 90 212 90"/>
    <path d="M120 102 C160 102 178 134 212 134"/>
  </g>
  <circle cx="120" cy="90" r="3.4" fill="#E4C77D"/>
  <!-- the many pieces -->
  <g fill="none" stroke="#E4C77D" stroke-width="1.5">
    <rect x="214" y="32" width="58" height="28" rx="6" opacity=".95"/>
    <rect x="214" y="76" width="58" height="28" rx="6" opacity=".95"/>
    <rect x="214" y="120" width="58" height="28" rx="6" opacity=".95"/>
  </g>
  <g stroke="#9FB0C2" stroke-width="2.2" stroke-linecap="round" opacity=".5">
    <line x1="222" y1="42" x2="250" y2="42"/><line x1="222" y1="50" x2="244" y2="50"/>
    <line x1="222" y1="86" x2="250" y2="86"/><line x1="222" y1="94" x2="244" y2="94"/>
    <line x1="222" y1="130" x2="250" y2="130"/><line x1="222" y1="138" x2="244" y2="138"/>
  </g>
  <g fill="#E4C77D">
    <circle cx="266" cy="36" r="2.2"/><circle cx="266" cy="80" r="2.2"/><circle cx="266" cy="124" r="2.2"/>
  </g>
</svg>
